<!-- tabla_buscador.html -->
<div class="overflow-auto h-100">
    <table class="table table-striped w-100">
        <thead class="bg-secondary text-white sticky-top">
            <tr>
                    <th>Codigo</th>
                    <th>Descripcion</th>
                    <th>Acciones</th>
            </tr>
        </thead>

    <tbody>
        {% for dato in datos %}
            <tr class="card-row" tabindex="0"
                data-id="{{ dato.id }}"
                data-codigo="{{ dato.codigo }}"
                data-descripcion="{{ dato.descripcion }}"
                data-final-rollo="{{ dato.final_rollo }}"
                data-final="{{ dato.final }}"
                data-final-efectivo="{{ dato.final_efectivo }}"
                data-final-rollo-efectivo="{{ dato.final_rollo_efectivo }}">
                <td class="{% if not dato.actualizado %}text-danger{% endif %}">  <h6>{{ dato.codigo }}</h6>
                </td>
                <td class="{% if not dato.actualizado %}text-danger{% endif %}">  <h6>{{ dato.descripcion }}</h6>
                </td>
                <td>
                    <button class="btn btn-success ver" id="ver-{{ dato.id }}" display="inline-block">Ver</button>
                    <button class="btn btn-success agregar" id="agregar-{{ dato.id }}" style="display: none;">Al carrito</button>
                    <button class="btn btn-primary editar" id="editar-{{ dato.id }}"display="inline-block">Editar</button>
                    {% if dato.tiene_cartel %}
                        <button class="btn btn-success" id="cartel-{{ dato.id }}" onclick="location.href='/x_cartel/imprimir/{{ dato.id }}';">Cartel</button>
                    {% else %}
                        <button class="btn btn-success" id="cartel-{{ dato.id }}" onclick="location.href='/x_cartel/imprimir/{{ dato.id }}';" style="display: none;">Cartel</button>
                    {% endif %}

                    {% if dato.tiene_pedido %}
                        Articulo Pedido
                    {% else %}
                        <button class='btn btn-secondary' onclick="agregarAlPedido({{ dato.id}})">Agregar al pedido</button>
                    {% endif %}

                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<div id="miModal" class="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-light border border-primary rounded shadow-lg p-4">
            <span class="close_mimodal">×</span>
            <form id="miFormulario" class="d-flex flex-column align-items-center">
                {% csrf_token %}
                <input type="hidden" id="id_articulo" name="id_articulo">

                <label for="cantidad">Cantidad (stock):</label><br>
                <input type="number" id="cantidad" name="cantidad"><br>

                <label for="barras">Barras:</label><br>
                <input type="number" id="barras" name="barras"><br>

                <label for="cajon">Cajón:</label><br>
                <select id="cajon" name="cajon">
                    <option value="">Ninguno</option>
                </select><br>

                <label for="proveedor">Proveedor:</label><br>
                <select id="proveedor" name="proveedor">
                    <option value="">Ninguno</option>
                </select><br>

                <label for="sub_titulo">Subtítulo:</label><br>
                <select id="sub_titulo" name="sub_titulo">
                    <option value="">Ninguno</option>
                </select><br>

                <label for="factor_division">Dividir precio por (factor):</label><br>
                <input type="number" step="0.01" min="0" id="factor_division" name="factor_division" placeholder="Vacío o 1 = sin división"><br>

                <label for="tiene_cartel">Tiene cartel:</label>
                <input type="checkbox" id="tiene_cartel" name="tiene_cartel"><br>

                <input type="submit" value="Enviar">
            </form>
        </div>
    </div>
</div>

<div id="ModalCarrito" class="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-white border border-secondary rounded shadow p-3">

            <span class="close_carrito">×</span>
            <form id="miFormularioCarrito" class="d-flex flex-column align-items-center">
                {% csrf_token %}
                <input type="hidden" id="id_articulo" name="id_articulo">
                <label for="cantidad">Cantidad:</label><br>
                <input type="number" id="cantidad_agregar" name="cantidad_agregar" step="0.01" value="1"><br>
                <input type="submit" value="Enviar">
            </form>
        </div>
    </div>
</div>

<script>
    let csrftoken = Cookies.get('csrftoken');
    let pendingAgregarPedidoId = null;

    function abrirModalEdicion(id) {
        return fetch('/editar_item/' + id + '/')
            .then(response => response.json())
            .then(data => {
                var cajones = JSON.parse(data.cajones);

                document.getElementById('id_articulo').value = id;
                document.getElementById('cantidad').value = data.modal_stock;
                document.getElementById('barras').value = data.modal_barras;
                document.getElementById('tiene_cartel').checked = !!data.modal_tiene_cartel;

                document.getElementById('cajon').innerHTML = cajones.map(function(c) {
                    var sel = (data.modal_cajon && c.pk === data.modal_cajon.id) ? ' selected' : '';
                    return '<option value="' + (c.pk === null ? '' : c.pk) + '"' + sel + '>' + c.fields.codigo + '</option>';
                }).join('');

                var provSel = document.getElementById('proveedor');
                var provOpts = ['<option value="">Ninguno</option>'];
                (data.proveedores || []).forEach(function(p) {
                    var sel = (data.modal_proveedor_id === p.id) ? ' selected' : '';
                    provOpts.push('<option value="' + p.id + '"' + sel + '>' + (p.nombre || '') + '</option>');
                });
                provSel.innerHTML = provOpts.join('');

                var stSel = document.getElementById('sub_titulo');
                var stOpts = ['<option value="">Ninguno</option>'];
                (data.subtitulos || []).forEach(function(s) {
                    var sel = (data.modal_sub_titulo_id === s.id) ? ' selected' : '';
                    stOpts.push('<option value="' + s.id + '"' + sel + '>' + (s.nombre || '') + '</option>');
                });
                stSel.innerHTML = stOpts.join('');

                document.getElementById('factor_division').value =
                    (data.modal_factor_division !== null && data.modal_factor_division !== undefined)
                        ? data.modal_factor_division : '';

                document.getElementById('miModal').style.display = 'block';
            });
    }

    window.addEventListener('load', () => {

        var usuarioActual = document.body.getAttribute('data-usuario');
        var esDarkydiel = (usuarioActual == 'darkydiel');


        document.querySelectorAll('.agregar').forEach(boton => {
            boton.addEventListener('click', event => {
                event.preventDefault();
                const id = boton.id.split('-')[1];
                document.getElementById('id_articulo').value = id;

                fetch('/usuarios_caja/')
                    .then(response => (response.ok ? response.json() : []))
                    .then(usuarios_caja => {
                        var formulario = document.getElementById('miFormularioCarrito');
                        var existingLabels = formulario.querySelectorAll('label[data-usuario-caja]');
                        existingLabels.forEach(lbl => lbl.remove());

                        usuarios_caja.forEach((usuario, idx) => {
                            var label = document.createElement('label');
                            label.setAttribute('data-usuario-caja', '1');
                            label.style.display = 'block';
                            label.textContent = usuario.nombre + ' ';
                            var radio = document.createElement('input');
                            radio.type = 'radio';
                            radio.name = 'usuario_caja';
                            radio.value = usuario.id;
                            if (idx === 0) radio.checked = true;
                            label.appendChild(radio);
                            formulario.appendChild(label);
                        });
                    })
                    .finally(() => {
                        document.getElementById('ModalCarrito').style.display = 'block';
                    });
            });
        });


        var close = document.querySelector('.close_mimodal');
        close.addEventListener('click', function() {
            document.getElementById('miModal').style.display = 'none';
            pendingAgregarPedidoId = null;
        });


        document.querySelectorAll('.ver').forEach(boton => {
            boton.addEventListener('click', event => {
                event.preventDefault();

                const row = boton.parentNode.parentNode;

                const codigo = row.dataset.codigo;
                const finalRollo = row.dataset.finalRollo;
                const final = row.dataset.final;
                const finalEfectivo = row.dataset.finalEfectivo;
                const finalRolloEfectivo = row.dataset.finalRolloEfectivo;
                if (!row.classList.contains('info-shown')) {
                    const infoRow = document.createElement('tr');
                    infoRow.innerHTML = `
                        <td colspan="3">
                            <div class="row">
                                <div class="contenedor">
                                    <div class="precio">
                                        <div><h5>Publico</h5></div>
                                        <div>${final}</div>
                                    </div>
                                    <div class="precio">
                                        <div><h5>Efectivo</h5></div>
                                        <div>${finalEfectivo}</div>
                                    </div>
                                </div>
                                <div class="contenedor">
                                    <div class="precio">
                                        <div><h5>Rollo/Caja</h5></div>
                                        <div>${finalRollo}</div>
                                    </div>
                                    <div class="precio">
                                        <div><h5>Rollo/Caja Efectivo</h5></div>
                                        <div>${finalRolloEfectivo}</div>
                                    </div>
                                </div>
                            </div>
                        </td>
                `;

                    row.parentNode.insertBefore(infoRow, row.nextSibling);
                    row.classList.add('info-shown');
                }

                boton.style.display = 'none';

                const id = boton.id.split('-')[1];
                document.getElementById('agregar-' + id).style.display = 'inline-block';
            });
        });

        document.querySelectorAll('.editar').forEach(boton => {
            boton.addEventListener('click', event => {
                event.preventDefault();
                const id = boton.id.split('-')[1];
                abrirModalEdicion(id);
            });
        });


        var close_carrito = document.querySelector('.close_carrito');
        close_carrito.addEventListener('click', function() {
            document.getElementById('ModalCarrito').style.display = 'none';
        });

        var csrftokenForm = document.querySelector('[name=csrfmiddlewaretoken]').value;

        var formulario = document.getElementById('miFormulario');
        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            var id_articulo = document.getElementById('id_articulo').value;
            var cantidad = document.getElementById('cantidad').value;
            var barras = document.getElementById('barras').value;
            var tiene_cartel = document.getElementById('tiene_cartel').checked;
            var cajon = document.getElementById('cajon').value;
            var proveedor_id = document.getElementById('proveedor').value;
            var sub_titulo_id = document.getElementById('sub_titulo').value;
            var factor_division = document.getElementById('factor_division').value;

            var payload = {
                id_articulo: id_articulo,
                stock: cantidad,
                barras: barras,
                tiene_cartel: tiene_cartel,
                cajon: cajon,
                proveedor_id: proveedor_id === '' ? null : proveedor_id,
                sub_titulo_id: sub_titulo_id === '' ? null : sub_titulo_id,
                factor_division: factor_division === '' ? null : factor_division
            };

            fetch('/editar_item/'+ id_articulo + '/', {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftokenForm
                }
            })
            .then(response => response.json().catch(() => ({})))
            .then(data => {
                document.getElementById('miModal').style.display = "none";
                var cartelBtn = document.getElementById('cartel-' + id_articulo);
                if (cartelBtn) {
                    cartelBtn.style.display = tiene_cartel ? 'block' : 'none';
                }

                var row = document.querySelector('tr[data-id="' + id_articulo + '"]');
                if (row) {
                    if (data.final !== undefined) row.dataset.final = data.final;
                    if (data.final_efectivo !== undefined) row.dataset.finalEfectivo = data.final_efectivo;
                    if (data.final_rollo !== undefined) row.dataset.finalRollo = data.final_rollo;
                    if (data.final_rollo_efectivo !== undefined) row.dataset.finalRolloEfectivo = data.final_rollo_efectivo;
                    if (row.classList.contains('info-shown')) {
                        var next = row.nextElementSibling;
                        if (next) next.remove();
                        row.classList.remove('info-shown');
                        var verBtn = document.getElementById('ver-' + id_articulo);
                        if (verBtn) {
                            verBtn.style.display = 'inline-block';
                            document.getElementById('agregar-' + id_articulo).style.display = 'none';
                        }
                    }
                }

                // Si había una operación pendiente (agregar al pedido por proveedor faltante), reintentar
                if (pendingAgregarPedidoId !== null) {
                    var pid = pendingAgregarPedidoId;
                    pendingAgregarPedidoId = null;
                    agregarAlPedido(pid);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('miModal').style.display = "none";
            });
        });




        var span = document.getElementsByClassName("close_carrito")[0];
        if (span) {
            span.onclick = function() {
                document.getElementById('ModalCarrito').style.display = "none";
            }
        }

        var formularioCarrito = document.getElementById('miFormularioCarrito');
        formularioCarrito.addEventListener('submit', function(event) {
            event.preventDefault();
            var id_articulo = document.getElementById('id_articulo').value;
            var cantidad = document.getElementById('cantidad_agregar').value;
            var selected = document.querySelector('input[name="usuario_caja"]:checked');
            var usuario_caja = selected ? Number(selected.value) : null;
            fetch('/agregar_articulo_a_carrito/'+ id_articulo + '/', {
                method: 'POST',
                body: JSON.stringify({id_articulo: id_articulo, cantidad: cantidad, usuario_caja: usuario_caja}),
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftokenForm
                }
            })
            .catch(error => console.error('Error:', error))
            .finally(() => {
                document.getElementById('ModalCarrito').style.display = "none";
            });
        });


    });


    function agregarAlPedido(id_articulo) {
        fetch('/agregar_articulo_a_pedido/'+ id_articulo + '/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            }
        })
        .then(response => {
            return response.json().catch(() => ({})).then(body => ({ ok: response.ok, status: response.status, body: body }));
        })
        .then(result => {
            if (result.ok) {
                location.reload();
                return;
            }
            if (result.body && result.body.error === 'missing_proveedor') {
                alert(result.body.message || 'El artículo no tiene proveedor asociado. Seleccioná uno y se reintentará.');
                pendingAgregarPedidoId = id_articulo;
                abrirModalEdicion(id_articulo);
                return;
            }
            alert((result.body && result.body.message) || 'Error al agregar al pedido');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error de red al agregar al pedido');
        });
    }


</script>
