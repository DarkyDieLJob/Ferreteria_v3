<style>
    /* ===== Carrito lateral ===== */
    #tablaCarrito {
        --card-bg: rgba(255, 255, 255, 0.95);
        --card-border: rgba(0, 0, 0, 0.08);
        --muted-fg: rgba(0, 0, 0, 0.6);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
        padding-bottom: 1rem;
    }
    @media (max-width: 768px) {
        #tablaCarrito {
            width: 95% !important;
        }
    }
    @media (min-width: 1400px) {
        #tablaCarrito {
            width: 520px !important;
        }
    }

    /* Header fijo del carrito */
    #tablaCarrito .cart-header {
        position: -webkit-sticky; /* Safari */
        position: sticky;
        top: 0;
        z-index: 2;
        background: inherit; /* fallback sólido si no hay backdrop-filter */
        -webkit-backdrop-filter: blur(6px); /* Safari/iOS */
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--card-border);
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
    }
    #tablaCarrito .cart-title {
        font-weight: 600;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0;
    }
    #tablaCarrito .cart-title small {
        opacity: 0.75;
        font-weight: 400;
    }

    /* Tarjetas internas */
    #tablaCarrito .cart-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 0.9rem;
        margin: 0.75rem 1rem;
        color: #212529;
    }
    #tablaCarrito .cart-card .section-title {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted-fg);
        margin-bottom: 0.6rem;
    }

    /* Inputs compactos y alineados */
    #tablaCarrito .form-control,
    #tablaCarrito .form-select {
        font-size: 0.925rem;
    }

    /* Tabla de artículos */
    #tablaCarrito #tabla-articulos {
        margin-bottom: 0;
    }
    #tablaCarrito #tabla-articulos thead th {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted-fg);
        border-bottom: 1px solid var(--card-border);
        background: transparent;
        padding: 0.5rem 0.5rem;
    }
    #tablaCarrito #tabla-articulos tbody td {
        vertical-align: middle;
        padding: 0.5rem 0.5rem;
    }
    #tablaCarrito #tabla-articulos tbody input[type=number].cantidad-articulo {
        width: 64px !important;
        padding: 0.15rem 0.35rem;
        border: 1px solid var(--card-border);
        border-radius: 6px;
    }
    #tablaCarrito #tabla-articulos tbody button.eliminar-articulo {
        padding: 0.1rem 0.5rem;
        font-size: 0.8rem;
        line-height: 1.2;
    }
    /* Filas de totales (últimas 2, aportadas por el JS con "Total" y "Total Efectivo") */
    #tablaCarrito #tabla-articulos tbody tr:nth-last-child(-n+2) td {
        font-weight: 600;
        border-top: 1px solid var(--card-border);
        background: rgba(0, 0, 0, 0.03);
    }

    /* Botones del formulario de transacción */
    #tablaCarrito .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
    }
    #tablaCarrito .btn-row .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }

    /* Loading indicator */
    .loading-indicator {
        display: none;
        position: fixed;
        top: 10px;
        right: 10px;
        background: #ffc107;
        padding: 5px 10px;
        border-radius: 3px;
        font-size: 12px;
        z-index: 1060;
    }

    /* Iconos SVG inline */
    .icon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
</style>

<script>
// Variables globales para el control de actualización
let cartUpdateInterval = null;
const CART_UPDATE_INTERVAL = 3000; // 3 segundos
let isUpdatingCart = false;
let lastCartData = null;

// Utilidades de color para contraste
function hexToRgb(hex) {
    if (!hex) return null;
    const m = hex.replace('#','');
    const bigint = parseInt(m, 16);
    if (m.length === 3) {
        const r = parseInt(m[0]+m[0],16);
        const g = parseInt(m[1]+m[1],16);
        const b = parseInt(m[2]+m[2],16);
        return {r, g, b};
    }
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return {r, g, b};
}

function getTextColorForBg(hex) {
    const rgb = hexToRgb(hex);
    if (!rgb) return '#000000';
    // luminancia relativa W3C
    const srgb = ['r','g','b'].map(k => {
        let c = rgb[k]/255;
        return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    });
    const L = 0.2126*srgb[0] + 0.7152*srgb[1] + 0.0722*srgb[2];
    return L > 0.5 ? '#000000' : '#FFFFFF';
}

// Función para mostrar/ocultar el indicador de carga
function toggleLoadingIndicator(show) {
    const indicator = document.getElementById('cartLoading');
    if (indicator) {
        indicator.style.display = show ? 'block' : 'none';
    }
}

// Función para iniciar la actualización automática
function startCartAutoUpdate() {
    // Detener cualquier intervalo existente
    stopCartAutoUpdate();
    
    // Iniciar nuevo intervalo
    cartUpdateInterval = setInterval(updateCartIfVisible, CART_UPDATE_INTERVAL);
    console.log('Iniciando actualización automática del carrito');
}

// Función para detener la actualización automática
function stopCartAutoUpdate() {
    if (cartUpdateInterval) {
        clearInterval(cartUpdateInterval);
        cartUpdateInterval = null;
        console.log('Detenida actualización automática del carrito');
    }
}

// Función para actualizar el carrito si está visible
function updateCartIfVisible() {
    // Solo actualizar si la pestaña está activa y el carrito está visible
    if (document.visibilityState === 'visible' && $("#tablaCarrito").is(":visible")) {
        const currentCartName = $("#tablaCarrito").data("nombre");
        if (currentCartName && !isUpdatingCart) {
            updateCart(currentCartName);
        }
    }
}

// Función para actualizar el carrito
function updateCart(nombre) {
    if (isUpdatingCart) return;
    
    isUpdatingCart = true;
    toggleLoadingIndicator(true);
    
    $.ajax({
        url: '/consultar_carrito/',
        type: 'get',
        data: (window.selectedUser && typeof window.selectedUser === 'string') ? { usuario: window.selectedUser } : {},
        dataType: 'json',
        success: function(data) {
            // Actualizar badges de cantidad en los botones de carrito
            if (typeof window.actualizarBadgesBotonesCarrito === 'function') {
                window.actualizarBadgesBotonesCarrito(data);
            }
            // Verificar si hay cambios antes de actualizar
            const currentData = JSON.stringify(data);
            if (lastCartData !== currentData) {
                lastCartData = currentData;
                llenarCarrito(nombre);
            }
        },
        error: function(xhr, status, error) {
            console.error('Error al actualizar el carrito:', error);
            // Reintentar después de un tiempo en caso de error
            setTimeout(() => isUpdatingCart = false, 5000);
        },
        complete: function() {
            toggleLoadingIndicator(false);
            isUpdatingCart = false;
        }
    });
}

// Resto de tu código JavaScript existente...
document.getElementById('enviar-transaccion').addEventListener('click', function(event) {
    const tablaArticulos = document.getElementById('tabla-articulos');
    console.log(tablaArticulos.rows.length)
    if (tablaArticulos.rows.length < 4 ) {
        event.preventDefault();
        alert('No hay artículos en el carrito. Agrega al menos uno antes de enviar la transacción.');
    }
});

// Botón "Clientes": abre el listado (CRUD)
document.getElementById('verClientes').onclick = function () {
    window.location.href = "/facturacion/clientes/";
};

// Helper CSRF
function _qcGetCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
}

// Mover el modal fuera del contenedor #tablaCarrito (position:fixed con z-index)
// para evitar que el backdrop de Bootstrap quede por encima del modal.
(function(){
    const modal = document.getElementById('modalNuevoCliente');
    if (modal && modal.parentElement && modal.parentElement.id !== 'body-modals-root') {
        document.body.appendChild(modal);
    }
})();

// Submit del modal de alta rápida de cliente
document.getElementById('formNuevoCliente').addEventListener('submit', function(e){
    e.preventDefault();
    const form = e.target;
    const errors = document.getElementById('formNuevoClienteErrors');
    errors.classList.add('d-none');
    errors.textContent = '';
    const payload = {
        razon_social: document.getElementById('qc_razon_social').value,
        cuit_dni: document.getElementById('qc_cuit_dni').value,
        tipo_documento: document.getElementById('qc_tipo_documento').value,
        responsabilidad_iva: document.getElementById('qc_responsabilidad_iva').value,
        telefono: document.getElementById('qc_telefono').value,
        domicilio: document.getElementById('qc_domicilio').value,
    };
    fetch('/facturacion/clientes/api/crear/', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': _qcGetCookie('csrftoken'),
            'X-Requested-With': 'XMLHttpRequest',
        },
        body: JSON.stringify(payload),
    }).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
            const c = data.cliente;
            const select = $("#cliente_id");
            select.append('<option value="' + c.id + '">' + c.razon_social + ' (' + c.cuit_dni + ')</option>');
            select.val(c.id);
            form.reset();
            const modalEl = document.getElementById('modalNuevoCliente');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.hide();
        } else {
            const errs = data.errors || {error: data.error || 'Error al crear cliente'};
            errors.textContent = typeof errs === 'string' ? errs : Object.entries(errs).map(([k,v]) => k + ': ' + (Array.isArray(v)?v.join(', '):v)).join(' | ');
            errors.classList.remove('d-none');
        }
    }).catch(err => {
        errors.textContent = 'Error de red: ' + err;
        errors.classList.remove('d-none');
    });
});

$(document).ready(function(){
    // Iniciar la actualización automática
    startCartAutoUpdate();
    
    // Manejar cambios en la visibilidad de la pestaña
    $(document).on('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            // Actualizar inmediatamente al volver a la pestaña
            const currentCartName = $("#tablaCarrito").data("nombre");
            if (currentCartName) {
                updateCart(currentCartName);
            }
            startCartAutoUpdate();
        } else {
            stopCartAutoUpdate();
        }
    });

    // Resto de tu código document.ready existente...
    $.ajax({
        url: '/obtener_cliente/',
        type: 'get',
        dataType: 'json',
        success: function(data) {
            var select = $("#cliente_id");
            data.clientes.forEach(function(cliente) {
                select.append('<option value="' + cliente.id + '">' + cliente.razon_social + ' (' + cliente.cuit_dni + ')' + '</option>');
            });
        }
    });
    
    // Resto de tu código JavaScript existente...
    $("#buscar_cliente").prop("disabled", true);
    $("#cliente_id").prop("disabled", true);

    $("#buscar_cliente").on('input', function() {
        var buscar = $(this).val().toLowerCase();
        $("#cliente_id option").each(function() {
            var texto = $(this).text().toLowerCase();
            $(this).toggle(texto.indexOf(buscar) > -1);
        });
    });

    // Guardar la selección de cliente por carrito visible
    $(document).on('change', '#cliente_id', function() {
        const nombre = $("#tablaCarrito").data("nombre");
        if (!nombre) return;
        window.clienteSeleccionadoPorCarrito = window.clienteSeleccionadoPorCarrito || {};
        window.clienteSeleccionadoPorCarrito[nombre] = $(this).val() || "";
    });

    $("#metodo_de_pago").change(function() {
        var metodoDePagoSeleccionado = $(this).val();
        if (metodoDePagoSeleccionado === '1') {
            $("#buscar_cliente").prop("disabled", true);
            $("#cliente_id").prop("disabled", true);
            $("#cliente_id").val("");
        } else {
            $("#buscar_cliente").prop("disabled", false);
            $("#cliente_id").prop("disabled", false);
        }
    });
    
    // Modificar la función mostrarCarrito para manejar la actualización automática
    window.mostrarCarrito = function(nombre) {
        if ($("#tablaCarrito").is(":visible")) {
            if ($("#tablaCarrito").data("nombre") !== nombre) {
                llenarCarrito(nombre);
            }
        } else {
            $("#tablaCarrito").show();
            llenarCarrito(nombre);
            // Forzar una actualización inmediata al mostrar el carrito
            updateCart(nombre);
        }
    };

    // Modificar llenarCarrito para actualizar lastCartData
    window.llenarCarrito = function(nombre) {
        toggleLoadingIndicator(true);
        return $.ajax({
            url: '/consultar_carrito/',
            type: 'get',
            data: (window.selectedUser && typeof window.selectedUser === 'string') ? { usuario: window.selectedUser } : {},
            dataType: 'json',
            success: function(data) {
                lastCartData = JSON.stringify(data); // Actualizar los datos del carrito
                if (typeof window.actualizarBadgesBotonesCarrito === 'function') {
                    window.actualizarBadgesBotonesCarrito(data);
                }
                var tbody = $("#tablaCarrito table tbody");
                tbody.empty();
                
                data[nombre].articulos.forEach(function(item) {
                    tbody.append('<tr><td>' + item.item + '</td><td><input type="number" class="cantidad-articulo" data-id="' + item.id + '" data-tipo="registrado" value="' + item.cantidad + '" style="width: 50px;"></td><td>' + item.precio + '</td><td><button class="btn btn-danger eliminar-articulo" data-id="' + item.id + '" data-tipo="registrado">X</button></td></tr>');
                });
                
                data[nombre].articulos_sin_registro.forEach(function(item) {
                    tbody.append('<tr><td>' + item.descripcion + '</td><td><input type="number" class="cantidad-articulo" data-id="' + item.id + '" data-tipo="no-registrado" value="' + item.cantidad + '" style="width: 50px;"></td><td>' + item.precio + '</td><td><button class="btn btn-danger eliminar-articulo" data-id="' + item.id + '" data-tipo="no-registrado">X</button></td></tr>');
                });
                
                tbody.append('<tr><td>Total</td><td></td><td>' + data[nombre].total + '</td><td></td></tr>');
                tbody.append('<tr><td>Total Efectivo</td><td></td><td>' + data[nombre].total_efectivo + '</td><td></td></tr>');
                
                // Detectar si cambió el carrito visible (no es un mero auto-refresh)
                const prevNombre = $("#tablaCarrito").data("nombre");
                const cartChanged = prevNombre !== nombre;

                $("#tablaCarrito").data("nombre", nombre);
                $("#cartHeaderNombre").text(nombre ? ('· ' + nombre) : '');
                $("#carrito_id").val(data[nombre].carrito_id);
                const bgColor = data[nombre].color || 'white';
                const fgColor = getTextColorForBg(bgColor);
                $("#tablaCarrito").css({
                    "background-color": bgColor,
                    "color": fgColor
                });
                // ajustar SOLO botones genéricos (sin variante Bootstrap propia)
                // para no romper el contraste de #enviar-transaccion, #nuevoCliente,
                // #verClientes, #cerrarCarrito, etc.
                $("#tablaCarrito .btn")
                    .not("#enviar-transaccion, #nuevoCliente, #verClientes, #cerrarCarrito, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-info, .btn-outline-secondary, .btn-secondary")
                    .css({
                        "border-color": fgColor,
                        "color": fgColor
                    });
                // Persistencia por carrito del cliente seleccionado
                window.clienteSeleccionadoPorCarrito = window.clienteSeleccionadoPorCarrito || {};
                if (cartChanged) {
                    // Restaurar selección previa para este carrito (si existe)
                    const prevSel = window.clienteSeleccionadoPorCarrito[nombre] || "";
                    $("#cliente_id").val(prevSel);
                    $("#buscar_cliente").val("");
                    $("#cliente_id option").show();
                }

                // Actualizar métodos de pago
                $.ajax({
                    url: '/obtener_metodos_pago/',
                    type: 'get',
                    dataType: 'json',
                    success: function(metodos_pago) {
                        var select = $("#metodo_de_pago");
                        var currentValue = select.val();
                        select.empty();
                        metodos_pago.forEach(function(metodo_pago) {
                            select.append('<option value="' + metodo_pago.id + '">' + metodo_pago.display + '</option>');
                        });
                        // Restaurar el valor seleccionado si existe
                        if (currentValue) {
                            select.val(currentValue);
                        }
                    }
                });
            },
            complete: function() {
                toggleLoadingIndicator(false);
            }
        });
    };
    
    // Resto de tus funciones existentes...
    function cambiarColorFondoCarrito(carrito_id) {
        const coloresCarritos = {
            1: "lightyellow",
            2: "lightgreen",
            3: "lightblue",
        };
        const color = coloresCarritos[carrito_id] || "white";
        $("#tablaCarrito").css("background-color", color);
    }
    
    $(document).on('change', '.cantidad-articulo', function() {
        var id = $(this).attr('data-id');
        var tipo = $(this).attr('data-tipo');
        var cantidad = $(this).val();
        var url = tipo === 'registrado' ? '/actualizar_cantidad_articulo/' : '/actualizar_cantidad_articulo_sin_registro/';
        
        $.ajax({
            url: url,
            type: 'post',
            data: JSON.stringify({
                'id': id,
                'cantidad': cantidad
            }),
            contentType: "application/json",
            success: function(data) {
                updateCart($("#tablaCarrito").data("nombre"));
            }
        });
    });
    
    $(document).on('click', '.eliminar-articulo', function() {
        var id = $(this).attr('data-id');
        var tipo = $(this).attr('data-tipo');
        var url = tipo === 'registrado' ? '/eliminar_articulo/' : '/eliminar_articulo_sin_registro/';
        
        $.ajax({
            url: url,
            type: 'post',
            data: JSON.stringify({
                'id': id
            }),
            contentType: "application/json",
            success: function(data) {
                updateCart($("#tablaCarrito").data("nombre"));
            }
        });
    });
    
    function getColorSeguro(color) {
        return color || 'white';
    }

    // Cuenta total de lineas de articulos (registrados + sin registro)
    function contarArticulos(info) {
        if (!info) return 0;
        var a = Array.isArray(info.articulos) ? info.articulos.length : 0;
        var b = Array.isArray(info.articulos_sin_registro) ? info.articulos_sin_registro.length : 0;
        return a + b;
    }

    // HTML de un boton de carrito con badge de cantidad (similar al navbar)
    window.buildBotonCarritoHTML = function(nombre, info) {
        var color = getColorSeguro(info.color);
        var tcolor = getTextColorForBg(color);
        var count = contarArticulos(info);
        var badge = count > 0
            ? '<span class="badge-carrito position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">' + count + '<span class="visually-hidden">articulos</span></span>'
            : '';
        return '<button id="botonCarrito' + nombre + '" class="btn me-2 mb-2 position-relative" style="background-color:' + color + '; color:' + tcolor + '; border-color:' + tcolor + ';">Carrito de ' + nombre + badge + '</button>';
    };

    // Actualiza badges de los botones existentes a partir de data de /consultar_carrito/
    window.actualizarBadgesBotonesCarrito = function(data) {
        if (!data) return;
        for (var nombre in data) {
            var btn = $('#botonCarrito' + nombre);
            if (!btn.length) continue;
            var count = contarArticulos(data[nombre]);
            var badge = btn.find('.badge-carrito');
            if (count > 0) {
                if (badge.length) {
                    badge.contents().filter(function(){ return this.nodeType === 3; }).first().replaceWith(document.createTextNode(count));
                } else {
                    btn.append('<span class="badge-carrito position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">' + count + '<span class="visually-hidden">articulos</span></span>');
                }
            } else if (badge.length) {
                badge.remove();
            }
        }
    };

    function crearControlador(nombre) {
        return function() {
            mostrarCarrito(nombre);
        };
    }

    // Inicialización de botones de carrito
    $.ajax({
        url: '/consultar_carrito/',
        type: 'get',
        dataType: 'json',
        success: function(data) {
            for (var nombre in data) {
                $("#botonesCarrito").append(window.buildBotonCarritoHTML(nombre, data[nombre]));
                $("#botonCarrito" + nombre).click(crearControlador(nombre));
            }
        }
    });

    // Selector de cajero (solo si hay usuarios de caja disponibles)
    $.ajax({
        url: '/usuarios_caja/',
        type: 'get',
        dataType: 'json',
        success: function(users) {
            if (Array.isArray(users) && users.length > 0) {
                const wrap = $('<div id="selectorCajeroWrap" class="cart-card"><div class="section-title"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Cajero</div><select id="selectorCajero" class="form-select form-select-sm"><option value="">Todos</option></select></div>');
                // Insertar justo después del header, antes de la primera sección
                wrap.insertBefore('#tablaCarrito .cart-card:first');
                const sel = $('#selectorCajero');
                users.forEach(function(u) {
                    sel.append('<option value="' + u.nombre + '">' + u.nombre + '</option>');
                });
                $(document).on('change', '#selectorCajero', function() {
                    const val = $(this).val();
                    window.selectedUser = val || null;
                    if (window.selectedUser) {
                        mostrarCarrito(window.selectedUser);
                    } else {
                        // Si no hay selección, refrescar lista general
                        $.get('/consultar_carrito/', function(data) {
                            $("#botonesCarrito").empty();
                            for (var nombre in data) {
                                $("#botonesCarrito").append(window.buildBotonCarritoHTML(nombre, data[nombre]));
                                $("#botonCarrito" + nombre).click(crearControlador(nombre));
                            }
                        });
                    }
                });
            }
        }
    });

    // Controlador para el botón de cerrar
    $("#cerrarCarrito").click(function() {
        $("#tablaCarrito").hide();
    });

    // Manejo del formulario de transacción
    $("#formTransaccion").submit(function(e) {
        e.preventDefault();
        var nombre = $("#tablaCarrito").data("nombre");
        
        $.ajax({
            url: '/consultar_carrito/',
            type: 'get',
            dataType: 'json',
            success: function(data) {
                $("#usuario").val(nombre);
                $("#carrito_id").val(data[nombre].carrito_id);
                $("#articulos_vendidos").val(JSON.stringify(data[nombre].articulos));
                $("#cliente_id").val();
                $("#total").val(data[nombre].total);
                $("#total_efectivo").val(data[nombre].total_efectivo);

                console.log(data[nombre].total);
                console.log(data[nombre].total_efectivo);
                console.log($("#formTransaccion").serialize());
                
                $.ajax({
                    url: '/procesar_transaccion/',
                    type: 'post',
                    data: $("#formTransaccion").serialize(),
                    beforeSend: function(xhr) {
                        xhr.setRequestHeader('X-CSRFToken', getCookie('csrftoken'));
                        $("#formTransaccion :input").prop("disabled", true);
                    },
                    success: function(response) {
                        $("#formTransaccion").trigger("reset");
                        $("#formArticuloSinRegistro").trigger("reset");
                        $("table tbody").empty();
                        $("#formTransaccion :input").prop("disabled", false);
                        $("#buscar_cliente").prop("disabled", true);
                        $("#cliente_id").prop("disabled", true);
                        $("#cliente_id").val("");
                        $("#buscar_cliente").val("");
                        // Mostrar nuevamente todas las opciones del select
                        $("#cliente_id option").show();
                        // Limpiar persistencia del carrito recién facturado
                        if (window.clienteSeleccionadoPorCarrito && nombre) {
                            delete window.clienteSeleccionadoPorCarrito[nombre];
                        }
                    }
                });
            }
        });
    });

    // Manejo del formulario de artículos sin registro
    $("#formArticuloSinRegistro").on("submit", function(e) {
        console.log('submit sin registros...');
        e.preventDefault();
        var descripcion = $("#descripcion").val();
        var cantidad = $("#cantidad").val();
        var precio = $("#precio").val();
        var carrito_id = $("#carrito_id").val();
        
        console.log('variables seteadas...');
        $.ajax({
            url: '/agregar_articulo_sin_registro/',
            type: 'post',
            data: JSON.stringify({
                'descripcion': descripcion,
                'cantidad': cantidad,
                'precio': precio,
                'carrito_id': carrito_id
            }),
            contentType: "application/json",
            success: function(data) {
                console.log('datos a /agregar_articulo_sin_registro/');
                console.log(data);
                updateCart($("#tablaCarrito").data("nombre"));
                console.log('tabla rellenada...');
                $("#formArticuloSinRegistro").trigger("reset");
            }
        });
    });

    // Función para obtener cookies
    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = jQuery.trim(cookies[i]);
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});

// Inicializar la actualización automática cuando el documento esté listo
$(document).ready(function() {
    startCartAutoUpdate();
});
</script>
