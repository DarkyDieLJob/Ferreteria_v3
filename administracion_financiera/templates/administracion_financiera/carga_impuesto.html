{% extends "administracion_financiera/base.html" %}
{% block title %}Cargar Impuesto · Administración Financiera{% endblock %}
{% block content %}
  <div class="flex flex-wrap gap-2 mb-4">
    <form method="get" action="{% url 'administracion_financiera:dashboard' %}"><button class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50" type="submit">Volver</button></form>
  </div>
  <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-lg font-semibold text-slate-800 mb-3">Cargar Impuesto</h2>
    <div class="mb-4 flex flex-wrap gap-2">
      <form method="get" action="{% url 'administracion_financiera:carga_boleta' %}"><button class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50" type="submit">Boleta</button></form>
      <form method="get" action="{% url 'administracion_financiera:carga_servicio' %}"><button class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50" type="submit">Servicio</button></form>
      <form method="get" action="{% url 'administracion_financiera:carga_impuesto' %}"><button class="rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800" type="submit">Impuesto</button></form>
      <form method="get" action="{% url 'administracion_financiera:carga_cheque' %}"><button class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50" type="submit">Cheque</button></form>
    </div>
    <form class="space-y-3" method="post">
      {% csrf_token %}
      {% include "administracion_financiera/_form_fields.html" with form=form %}
      <div class="flex gap-2">
        <button class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500" type="submit">Guardar</button>
      </div>
    </form>
  </div>
{% endblock %}
