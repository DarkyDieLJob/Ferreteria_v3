# SDD / OpenSpec project configuration — generated by sdd-init (2026-09-23)
schema: spec-driven

context: |
  Tech stack: Python 3.10, Django 4.0.6 monolith (~17 local apps). SQLite by default;
  PostgreSQL 16 when DB_HOST env is set. gunicorn; Docker (python:3.10-slim) + docker-compose.
  Architecture: Django MTV monolith. Domain apps: bdd, facturacion, pedido, boletas, cajas,
  actualizador, reportes, administracion_financiera, articulos, carga_archivo.
  Platform apps: core_config, core_andamios, core_docs, core_elementos, core_index,
  core_testing. UI apps: x_articulos, x_cartel, x_widgets. Settings: core_config.settings
  (env-based, gitignored, machine-local — never commit).
  Testing: pytest + pytest-django via pytest.ini at root. Real tests live in tests/;
  per-app tests.py are mostly Django stubs. Factories: factory_boy, Faker,
  django-dynamic-fixture (ddf G()).
  Style: es-ar locale (LANGUAGE_CODE es-ar, TZ America/Argentina/Buenos_Aires); docs and UI
  in Spanish; Bootstrap 4 + django-crispy-forms; conventional commits + standard-version
  (npx standard-version) drive CHANGELOG.md releases.

strict_tdd: true

# One entry per in-scope project. This workspace has a single Django monolith at root;
# core_docs/docs/Makefile is a Sphinx docs build inside the monolith, not a separate project.
projects:
  - path: "."
    stack: "Python 3.10 / Django 4.0.6"
    test_command: "pytest"          # run from repo root with venv active (or venv/bin/pytest)
    test_framework: "pytest + pytest-django"
    coverage_command: ""            # no coverage tool installed; htmlcov/ is a stale artifact
    lint_command: ""                # no linter configured
    typecheck_command: ""           # no type checker configured
    format_command: "black ."       # black 26.1.0 present in local venv; NOT pinned in requirements.txt

testing:
  strict_tdd: true
  workspace_test_command: "pytest"  # configured by pytest.ini (DJANGO_SETTINGS_MODULE=core_config.settings)
  known_issues:
    - "pytest at root exits 2 during collection: core_andamios/tests.py line 2 imports models,
       which resolve under the Ferreteria_v3.* package prefix because a stray __init__.py exists
       at repo root -> RuntimeError: no app_label / not in INSTALLED_APPS. Pre-existing repo bug.
       Workaround subset: 'pytest tests/' collects all 45 tests cleanly (verified 2026-09-23)."
    - "Most per-app tests.py files are 3-line Django stubs; the effective suite lives in tests/
       (tests/articulos, tests/facturacion, tests/test_rounding.py = 45 tests collected)."
    - "core_config/settings.py and core_config/settings_tests.py are gitignored; settings.py is
       env-based (DEBUG, DB_HOST/DB_NAME/DB_USER/DB_PASSWORD/DB_PORT, LOG_DIR, SECRET_KEY)."
  layers:
    unit: "pytest + pytest-django + factory_boy + Faker + django-dynamic-fixture"
    integration: "Django test Client / pytest-django db available via installed deps; minimal current usage"
    e2e: "none detected (no selenium, playwright, or cypress)"
  coverage: "not installed (no coverage or pytest-cov in requirements.txt or venv); htmlcov/ is stale output"
  quality:
    linter: "none detected"
    type_checker: "none detected (mypy_extensions lib present only as black dependency)"
    formatter: "black 26.1.0 in venv (unpinned)"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag migration impact: models write to a real production database (SQLite locally, Postgres in Docker)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect app boundaries: domain apps, core_* platform apps, x_* UI apps
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Never commit core_config/settings.py, *.sqlite3, .env.production, credentials (gitignored)
      - Prefer additive model changes; README discourages editing fields that affect other apps
    tdd: true
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: "docker compose build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
